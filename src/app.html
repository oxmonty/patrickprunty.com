<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
			No viewport-fit=cover. It extends the layout viewport under the browser's
			own chrome, and Safari 26's floating toolbars then cover the top of the
			page — the sticky header was drawn behind the URL bar until a scroll
			collapsed it. env(safe-area-inset-top) cannot buy that strip back: it
			reports the display's notch inset, not the toolbar's, and the toolbar
			reaches well past it.
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/webp" href="/icons/favicon.webp" />
		<!-- iOS ignores WebP for the home-screen icon. -->
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="alternate" type="application/rss+xml" title="Patrick Prunty" href="/rss.xml" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
